name: Build Tweak dylib
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 部署编译环境 Theos
        run: |
          sudo apt update
          sudo apt install git build-essential ldid fakeroot curl -y
          echo "export THEOS=$HOME/theos" >> ~/.bashrc
          source ~/.bashrc
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          cd $HOME/theos
          curl -LO https://github.com/theos/sdks/archive/refs/tags/iPhoneOS16.5.sdk.tar.gz
          tar -zxvf iPhoneOS16.5.sdk.tar.gz
          mv sdks-iPhoneOS16.5.sdk sdks

      - name: 执行编译
        run: |
          source ~/.bashrc
          make clean
          make

      - name: ldid签名（全能签/巨魔必备，防闪退）
        run: |
          source ~/.bashrc
          ldid -Sentitlements.plist .theos/obj/arm64/*.dylib

      - name: 上传编译成品
        uses: actions/upload-artifact@v4
        with:
          name: 编译好的dylib插件
          path: .theos/obj/arm64/*.dylib
